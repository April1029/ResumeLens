<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ResumeLens prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#18212B; --muted:#4F5C69; --line:#D3DAE1;
  --lens:#1D5C8C; --lens-ink:#FFFFFF; --lens-weak:#E2EDF6; --lens-line:#9CC1DF;
  --amber:#8A5300; --amber-weak:#FBEBD0; --amber-line:#E5B467;
  --gap:#5A6370; --gap-weak:#E9ECEF;
  --focus:#1D5C8C;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#11161C; --surface:#1A2129; --surface-2:#151B22; --ink:#E5EAF0; --muted:#A3AFBB; --line:#2E3843;
    --lens:#86BDE8; --lens-ink:#0E1A24; --lens-weak:#1B3246; --lens-line:#33597A;
    --amber:#F2BA62; --amber-weak:#3A2B12; --amber-line:#7A5A22;
    --gap:#A8B1BB; --gap-weak:#252D35; --focus:#86BDE8;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#11161C; --surface:#1A2129; --surface-2:#151B22; --ink:#E5EAF0; --muted:#A3AFBB; --line:#2E3843;
  --lens:#86BDE8; --lens-ink:#0E1A24; --lens-weak:#1B3246; --lens-line:#33597A;
  --amber:#F2BA62; --amber-weak:#3A2B12; --amber-line:#7A5A22;
  --gap:#A8B1BB; --gap-weak:#252D35; --focus:#86BDE8;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{flex:none}
.brand small{font-weight:400;color:var(--muted);font-size:13px;margin-left:4px}
.steps{display:flex;gap:4px;list-style:none;margin:0;padding:0;flex-wrap:wrap;flex:1}
.steps button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px;min-height:40px}
.steps button:disabled{cursor:default;opacity:.55}
.steps button:not(:disabled):hover{background:var(--surface-2)}
.steps .n{width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.steps button[aria-current="step"]{color:var(--ink);font-weight:600}
.steps button[aria-current="step"] .n{background:var(--lens);border-color:var(--lens);color:var(--lens-ink)}
.steps button.done .n{background:var(--lens-weak);border-color:var(--lens-line);color:var(--lens)}
.stepnav{flex:1}
.mode-pill{font-size:13px;color:var(--muted);white-space:nowrap}

main{max-width:1280px;margin:0 auto;padding:28px 20px 64px}
h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:0 0 8px;font-weight:700;max-width:22ch}
h2{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:15px;margin:0}
.lede{color:var(--muted);margin:0 0 24px;max-width:64ch}
.muted{color:var(--muted)}
.small{font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--lens);border-color:var(--lens);color:var(--lens-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.linkbtn{border:0;background:none;padding:0;color:var(--lens);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:24px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}

/* step 1 */
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.field{display:flex;flex-direction:column;padding:16px}
.field label{font-weight:600;margin-bottom:2px}
.field .hint{font-size:13px;color:var(--muted);margin-bottom:10px}
.field textarea{width:100%;min-height:380px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);font-size:13.5px;line-height:1.55;font-family:var(--sans)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;border:0;padding:0}
.modes legend{font-weight:600;margin-bottom:8px;padding:0}
.mode{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.mode:has(input:checked){border-color:var(--lens);background:var(--lens-weak)}
.mode input{margin-top:4px;accent-color:var(--lens);width:18px;height:18px;flex:none}
.mode b{display:block}
.mode span{font-size:13.5px;color:var(--muted)}
.notice{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);margin-top:14px}
.status-msg{margin-top:12px;font-size:14px}
.status-msg.err{color:var(--amber)}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--lens-line);border-top-color:var(--lens);animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* status chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px;white-space:nowrap}
.chip svg{flex:none}
.chip.found{background:var(--lens-weak);color:var(--lens)}
.chip.different{background:var(--amber-weak);color:var(--amber)}
.chip.missing{background:var(--gap-weak);color:var(--gap)}
.chip.plain{background:var(--surface-2);color:var(--muted);font-weight:500;border:1px solid var(--line)}

/* evidence map */
.tally{display:flex;gap:0;border-radius:10px;overflow:hidden;height:12px;margin:6px 0 10px;background:var(--gap-weak)}
.tally i{display:block;height:100%}
.tally .found{background:var(--lens)}
.tally .different{background:var(--amber-line)}
.tally .missing{background:transparent}
.tally-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.tally-legend b{font-size:18px;margin-right:4px}
.honest{font-size:13.5px;color:var(--muted);margin-top:10px;max-width:70ch}
.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;margin-top:22px;align-items:start}
.posting{position:sticky;top:84px;padding:16px 8px 16px 16px}
.posting h2{padding-right:8px}
.posting .scroll{max-height:calc(100vh - 190px);overflow:auto;padding-right:8px;margin-top:10px}
.pline{display:grid;grid-template-columns:26px 1fr;gap:4px;padding:5px 8px 5px 4px;border-radius:8px;font-size:14px;line-height:1.45;transition:background .15s}
.pline .ln{font-size:11px;color:var(--muted);text-align:right;padding-top:3px;font-variant-numeric:tabular-nums}
.pline.head{font-weight:600}
.pline.req{cursor:pointer}
.pline.req.found{box-shadow:inset 3px 0 0 var(--lens)}
.pline.req.different{box-shadow:inset 3px 0 0 var(--amber-line)}
.pline.req.missing{box-shadow:inset 3px 0 0 var(--gap)}
.pline.req:hover{background:var(--surface-2)}
.pline.active{background:var(--lens-weak)!important}
.pline .tag{display:block;font-size:12px;color:var(--muted);margin-top:2px}

.group{margin-bottom:22px}
.group > h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.req-row{width:100%;text-align:left;display:block;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px;cursor:pointer}
.req-row:hover{border-color:var(--lens-line)}
.req-row.active{border-color:var(--lens);box-shadow:0 0 0 1px var(--lens)}
.req-row .rt{font-weight:600}
.evq{margin:8px 0 0;padding:8px 10px;background:var(--surface-2);border-radius:8px;font-family:var(--serif);font-size:14px}
.evq .lbl{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-bottom:2px}
.req-row p{margin:8px 0 0;font-size:14px;color:var(--muted)}
.learn{margin-top:8px;font-size:14px}
.learn b{color:var(--ink)}

/* suggestions */
.progress{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.bar{flex:1;min-width:160px;height:8px;border-radius:99px;background:var(--gap-weak);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lens);transition:width .25s}
.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:14px;overflow:hidden}
.card.active{border-color:var(--lens);box-shadow:0 0 0 1px var(--lens)}
.card-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 16px 0;cursor:pointer}
.card-h .req-label{font-size:12.5px;color:var(--muted)}
.card-h .rt{font-weight:600}
.card-b{padding:12px 16px 16px;display:grid;gap:12px}
.row-l{font-size:12.5px;color:var(--muted);margin-bottom:3px;font-weight:500}
.orig{font-family:var(--serif);font-size:15px;color:var(--muted)}
.prop{font-family:var(--serif);font-size:15.5px;line-height:1.55}
.prop ins{text-decoration:none;background:var(--lens-weak);color:var(--ink);border-bottom:2px solid var(--lens);padding:0 1px}
.prop del{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.prop .ph,.ph{background:var(--amber-weak);color:var(--amber);border:1px dashed var(--amber-line);border-radius:4px;padding:0 3px;font-family:var(--sans);font-size:13.5px;font-weight:500}
.why{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.why .ln{font-size:12px;font-weight:600;color:var(--lens);background:var(--lens-weak);border-radius:6px;padding:2px 7px;white-space:nowrap}
.why q{font-size:14px;quotes:"\201C" "\201D"}
.why .note{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.claim{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px dashed var(--amber-line);border-radius:10px;background:var(--amber-weak);font-size:14px;cursor:pointer}
.claim input{width:18px;height:18px;margin-top:2px;accent-color:var(--amber);flex:none}
.claim b{color:var(--amber)}
.card-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card-a .state{margin-left:auto;font-size:13.5px;font-weight:600}
.state.accepted,.state.edited{color:var(--lens)}
.state.skipped{color:var(--muted)}
.card.decided-skipped .card-b > :not(.card-a){opacity:.55}
.edit-box{width:100%;min-height:84px;border:1.5px solid var(--lens);border-radius:10px;padding:10px;font-family:var(--serif);font-size:15px;background:var(--surface);resize:vertical}
.blocker{font-size:13px;color:var(--amber)}
.nosug{border:1px dashed var(--line);border-radius:14px;padding:14px 16px;margin-top:8px}
.nosug h3{margin-bottom:6px}
.nosug ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.nosug li{margin-bottom:6px}

/* paper */
.paper-wrap{overflow-x:auto;padding:4px 4px 12px}
.paper{position:relative;width:720px;min-height:932px;margin:0 auto;background:#fff;color:#1b1b1b;box-shadow:0 1px 2px rgba(20,30,40,.12),0 8px 28px rgba(20,30,40,.10);padding:46px 50px;font-family:var(--serif);font-size:12.5px;line-height:1.38;color-scheme:light}
.paper .nm{font-size:22px;font-weight:700;text-align:center;letter-spacing:.01em}
.paper .ct{text-align:center;color:#4a4a4a;font-size:11.5px;margin-bottom:6px}
.paper .sec{font-size:12.5px;font-weight:700;letter-spacing:.06em;border-bottom:1px solid #9a9a9a;margin:10px 0 4px;padding-bottom:1px}
.paper .it{display:flex;justify-content:space-between;gap:12px;margin-top:4px}
.paper .it b{font-weight:600}
.paper .it .dt{color:#4a4a4a;white-space:nowrap;font-style:italic}
.paper ul{margin:1px 0 0;padding-left:16px}
.paper li{margin:1px 0}
.paper li.chg{background:#E2EDF6;box-shadow:inset 0 -2px 0 #1D5C8C;cursor:pointer;border-radius:2px}
.paper li.chg:hover,.paper li.chg.sel{background:#CFE2F2}
.paper li.trim-flag{background:#F1F1F1;color:#666}
.paper .ph{font-size:11px}
.pagebreak{position:absolute;left:0;right:0;border-top:2px dashed #B26A00;pointer-events:none}
.pagebreak span{position:absolute;right:8px;top:-22px;font-family:var(--sans);font-size:11.5px;font-weight:600;color:#8A5300;background:#FBEBD0;border-radius:6px;padding:1px 7px}

.review{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.side{position:sticky;top:84px;display:grid;gap:14px}
.side .panel{padding:16px}
.fit{display:flex;align-items:center;gap:12px}
.fit-meter{flex:1;height:10px;border-radius:99px;background:var(--gap-weak);position:relative;overflow:hidden}
.fit-meter i{position:absolute;left:0;top:0;bottom:0;background:var(--lens);border-radius:99px}
.fit-meter.over i{background:var(--amber-line)}
.fit-msg{font-weight:600;margin-top:8px}
.fit-msg.over{color:var(--amber)}
.trim{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.trim:first-of-type{border-top:0}
.trim input{width:18px;height:18px;margin-top:2px;accent-color:var(--lens);flex:none}
.trim .why2{display:block;font-size:12.5px;color:var(--muted)}
.detail q{font-family:var(--serif);quotes:"\201C" "\201D"}
.defend{margin:8px 0 0;padding-left:18px;font-size:14px}
.defend li{margin-bottom:6px}

.out-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.log{list-style:none;margin:10px 0 0;padding:0}
.log li{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.log .from{color:var(--muted);text-decoration:line-through;font-family:var(--serif)}
.log .to{font-family:var(--serif)}
.log .because{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:960px){
  .inputs,.two,.review,.out-grid,.modes{grid-template-columns:1fr}
  .posting,.side{position:static}
  .posting .scroll{max-height:320px}
  .top-in{gap:6px 12px;padding:8px 14px}
  .stepnav{flex-basis:100%;order:3}
  .steps{flex-wrap:nowrap;overflow-x:auto}
  .mode-pill{margin-left:auto}
  .steps .lbl{display:none}
  .steps button[aria-current="step"] .lbl{display:inline}
  h1{font-size:25px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="11" cy="11" r="7.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16.6 16.6 23 23" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M7.5 9h7M7.5 12.5h4.5" stroke="var(--lens)" stroke-width="1.8" stroke-linecap="round"/></svg>
      ResumeLens <small>prototype</small>
    </div>
    <nav aria-label="Progress" class="stepnav"><ol class="steps" id="steps"></ol></nav>
    <div class="mode-pill" id="modePill"></div>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const PH_RE = /\[[^\]]+\]/g;
const markPh = html => html.replace(/\[[^\]]+\]/g, m => `<span class="ph">${m}</span>`);
const hasPh = t => /\[[^\]]+\]/.test(t || "");
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

function resumeToText(r){
  const out=[r.name, r.contact, ""];
  for(const s of r.sections){
    out.push(s.heading.toUpperCase());
    for(const it of s.items){
      if(it.title) out.push(it.title + (it.meta ? " | " + it.meta : ""));
      for(const b of it.bullets) out.push("- " + b.text);
    }
    out.push("");
  }
  return out.join("\n").trim();
}
const DEMO_RESUME = resumeToText(DEMO_RESUME_OBJ);

function diffWords(a, b){
  const A=a.split(/\s+/).filter(Boolean), B=b.split(/\s+/).filter(Boolean);
  const n=A.length, m=B.length, dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  const norm = w => w.toLowerCase().replace(/[.,;:]$/,"");
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]= norm(A[i])===norm(B[j]) ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[]; let i=0,j=0;
  while(i<n&&j<m){
    if(norm(A[i])===norm(B[j])){ops.push(["=",B[j]]);i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){ops.push(["-",A[i]]);i++;}
    else {ops.push(["+",B[j]]);j++;}
  }
  while(i<n) ops.push(["-",A[i++]]); while(j<m) ops.push(["+",B[j++]]);
  // merge runs
  const html=[]; let cur=null, buf=[];
  const flush=()=>{ if(!buf.length) return; const t=markPh(esc(buf.join(" ")));
    html.push(cur==="+"?`<ins>${t}</ins>`:cur==="-"?`<del>${t}</del>`:t); buf=[]; };
  for(const [op,w] of ops){ if(op!==cur){flush();cur=op;} buf.push(w); }
  flush();
  return html.join(" ");
}

  dec:{}, hidden:new Set(), activeReq:null, activeSug:null, editing:null, selBullet:null,

};
let sampleFn = null, downloadsApi = null;

function bulletById(id){
  for(const s of state.resume.sections) for(const it of s.items) for(const b of it.bullets) if(b.id===id) return b;
  return null;
}
function reqById(id){ return state.reqs.find(r=>r.id===id); }
function sugForBullet(id){ return state.sugs.find(s=>s.bulletId===id); }
function finalText(id){
  const b=bulletById(id); const s=sugForBullet(id);
  if(s){ const d=state.dec[s.id]; if(d && (d.status==="accepted"||d.status==="edited")) return d.text; }
  return b ? b.text : "";
}
function isChanged(id){ const s=sugForBullet(id); if(!s) return false; const d=state.dec[s.id]; return d && (d.status==="accepted"||d.status==="edited"); }

function loadAnalysis(resume, analysis, source){
  state.resume = resume;
  state.posting = state.postingText.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  state.reqs = analysis.requirements;
  state.sugs = analysis.suggestions.map(s=>({...s, original: (bulletById(s.bulletId)||{}).text || ""}));
  state.trims = analysis.trims || [];
  state.source = source;
  state.dec = {}; state.hidden = new Set(); state.activeReq=null; state.activeSug=null; state.editing=null; state.selBullet=null;
  for(const s of state.sugs){
    const auto = state.mode==="fast" && s.kind==="wording" && !s.needsConfirm && !hasPh(s.proposed);
    state.dec[s.id] = auto ? {status:"accepted", text:s.proposed, auto:true, confirmed:false} : {status:"pending", text:s.proposed, confirmed:false};
  }
  state.maxStep = 2; go(2);
}

/* ---------- Claude analysis for the viewer's own text ---------- */
function buildPrompt(){
  const lines = state.postingText.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const numbered = lines.map((l,i)=>`${i}: ${l}`).join("\n");
  return `You are the analysis engine of ResumeLens, a tool that helps students tailor a resume to one job posting WITHOUT inventing anything.

JOB POSTING (numbered lines):
${numbered}

MASTER RESUME (plain text):
${state.resumeText}

Return ONLY a JSON object, no prose, no code fences, with this shape:
{
 "resume": {"name": str, "contact": str, "sections": [{"heading": str, "items": [{"title": str, "meta": str, "bullets": [{"id": "b1", "text": str}]}]}]},
 "requirements": [{"id":"r1","line": <posting line number>,"text": str,"status":"found"|"different"|"missing","gapType":"terminology"|"real"|null,"evidence":[bullet ids],"note": str,"learn": str|null}],
 "suggestions": [{"id":"s1","reqId":"r1","bulletId":"b3","kind":"wording"|"new detail","needsConfirm": bool,"claimCheck": str|null,"proposed": str,"note": str}],
 "trims": [{"bulletId":"b9","reason": str}]
}

Rules:
- resume: reproduce the resume faithfully, splitting it into sections, items and bullets. Every line of content becomes a bullet with a unique id b1, b2, ... in order. Skills lines are bullets in a "Skills" section with empty title. Do not change any wording here.
- requirements: 6 to 10 concrete requirements from the posting, each tied to the posting line it comes from. "found" = clearly shown; "different" = the experience is there but named differently or only implied (gapType "terminology", e.g. GitHub Actions vs GitLab CI); "missing" = not supported by the resume (gapType "real") and give a short, concrete "learn" tip for building it honestly.
- suggestions: at most one per bullet, at most 7 total, only for "found" or "different" requirements. Never add a tool, number, scale, result or responsibility the resume doesn't state. If a stronger bullet needs a fact you don't have, write it as a bracketed placeholder like [number of users]. kind "wording" = rewording or reordering only, nothing new claimed; "new detail" = makes something explicit that is only implied. needsConfirm = true whenever the suggestion states something the resume only implies, and claimCheck is a yes/no question the user must answer truthfully. note = one short sentence on why, in plain language. Never suggest anything for "missing" requirements.
- trims: up to 5 bullets that relate least to this posting, with a one-line reason.
- Plain, friendly language. Use typographic apostrophes.`;
}

function validate(o){
  if(!o || !o.resume || !Array.isArray(o.resume.sections)) throw new Error("bad");
  const ids=new Set(); let n=0;
  for(const s of o.resume.sections){ s.items = Array.isArray(s.items)?s.items:[];
    for(const it of s.items){ it.title=it.title||""; it.meta=it.meta||""; it.bullets=Array.isArray(it.bullets)?it.bullets:[];
      for(const b of it.bullets){ if(!b.id||ids.has(b.id)) b.id="b"+(++n+1000); ids.add(b.id); b.text=String(b.text||""); } } }
  const reqs=(o.requirements||[]).filter(r=>r&&r.text).map((r,i)=>({id:r.id||"r"+i,line:Number.isInteger(r.line)?r.line:-1,text:r.text,
    status:["found","different","missing"].includes(r.status)?r.status:"missing",gapType:r.gapType||null,
    evidence:(r.evidence||[]).filter(x=>ids.has(x)),note:r.note||"",learn:r.learn||null}));
  const reqIds=new Set(reqs.map(r=>r.id)); const used=new Set();
  const sugs=(o.suggestions||[]).filter(s=>s&&ids.has(s.bulletId)&&reqIds.has(s.reqId)&&s.proposed&&!used.has(s.bulletId)&&used.add(s.bulletId))
    .map((s,i)=>({id:s.id||"s"+i,reqId:s.reqId,bulletId:s.bulletId,kind:s.kind==="wording"?"wording":"new detail",
      needsConfirm:!!s.needsConfirm,claimCheck:s.claimCheck||null,proposed:String(s.proposed),note:s.note||""}));
  const trims=(o.trims||[]).filter(t=>t&&ids.has(t.bulletId)).slice(0,5);
  return {resume:{name:o.resume.name||"",contact:o.resume.contact||"",sections:o.resume.sections}, analysis:{requirements:reqs,suggestions:sugs,trims}};
}

async function analyze(){
  state.err="";
  const isDemo = state.resumeText.trim()===DEMO_RESUME.trim() && state.postingText.trim()===DEMO_POSTING.trim();
  if(isDemo){ state.postingText = DEMO_POSTING; loadAnalysis(JSON.parse(JSON.stringify(DEMO_RESUME_OBJ)), JSON.parse(JSON.stringify(DEMO_ANALYSIS)), "example"); return; }
  if(!state.resumeText.trim() || !state.postingText.trim()){ state.err="Add both a resume and a job posting to continue."; render(); return; }
  if(!sampleFn){ state.err="Analyzing your own text needs Claude, which isn’t available in this view. Choose “Use the example” to try the full flow."; render(); return; }
  state.busy=true; state.ctl=new AbortController(); render();
  try{
    const raw = await sampleFn.json(buildPrompt(), {modelTier:"default", signal:state.ctl.signal});
    const v = validate(raw);
    state.busy=false;
    loadAnalysis(v.resume, v.analysis, "claude");
  }catch(e){
    state.busy=false;
    const code = e && e.code;
    state.err = code==="cancelled" ? "" :
      code==="not_granted" ? "Claude wasn’t allowed for this page, so your text wasn’t analyzed. The example still works." :
      code==="rate_limited" ? "Too many requests right now. Wait a minute, then choose Map my evidence again." :
      "The analysis came back in a form ResumeLens couldn’t read. Choose Map my evidence to try again.";
    render();
  }
}

function cardHTML(s){
  const r=reqById(s.reqId)||{}; const d=state.dec[s.id]; const active=state.activeSug===s.id;
  const editing = state.editing===s.id;
  const text = d.text;
  const phBlock = hasPh(text);
  const confirmBlock = s.needsConfirm && !d.confirmed;
  const blocked = phBlock || confirmBlock;
  const stateLbl = {pending:"", accepted: d.auto?"Pre-accepted":"Accepted", edited:"Accepted with your edits", skipped:"Skipped"}[d.status];
  return `<article class="card ${active?"active":""} decided-${d.status}" id="card-${s.id}">
    <div class="card-h" data-sug="${s.id}">
      <div><div class="req-label">Requirement</div><div class="rt">${esc(r.text)}</div></div>
      <span class="chip plain">${s.kind==="wording"?"Wording only":"Adds detail"}</span>
    </div>
    <div class="card-b">
      <div><div class="row-l">In your resume</div><div class="orig">${esc(s.original)}</div></div>
      <div><div class="row-l">${d.status==="edited"?"Your version":"Suggested"}</div>
        ${editing?`<textarea class="edit-box" id="edit-${s.id}" aria-label="Edit suggestion">${esc(text)}</textarea>`
          :`<div class="prop">${diffWords(s.original, text)}</div>`}
      </div>
      <div class="why"><span class="ln">Line ${(r.line??-1)+1}</span><div><q>${esc(state.posting[r.line]||r.text)}</q><span class="note">${esc(s.note)}</span></div></div>
      ${s.needsConfirm?`<label class="claim"><input type="checkbox" data-confirm="${s.id}" ${d.confirmed?"checked":""}><span><b>Is this true?</b> ${esc(s.claimCheck||"Confirm this matches what you actually did.")}</span></label>`:""}
      <div class="card-a">
        ${editing?`<button class="btn sm primary" data-save="${s.id}">Save my version</button><button class="btn sm" data-cancel="${s.id}">Cancel</button>`
        : d.status==="pending" ? `
          <button class="btn sm primary" data-accept="${s.id}" ${blocked?"disabled":""}>Accept</button>
          <button class="btn sm" data-edit="${s.id}">Edit</button>
          <button class="btn sm" data-skip="${s.id}">Skip</button>
          ${blocked?`<span class="blocker">${phBlock?"Edit to fill in or remove the highlighted placeholder.":"Confirm it’s true before accepting."}</span>`:""}`
        : `<button class="btn sm" data-undo="${s.id}">Undo</button>${d.status!=="skipped"?`<button class="btn sm" data-edit="${s.id}">Edit</button>`:""}`}
        ${stateLbl?`<span class="state ${d.status}">${stateLbl}</span>`:""}
      </div>
    </div>
  </article>`;
}

/* ---------- paper ---------- */
function paperHTML(mode){
  const R=state.resume;
  const secs=R.sections.map(s=>{
    const items=s.items.map(it=>{
      const bl=it.bullets.filter(b=>!state.hidden.has(b.id));
      if(!bl.length && !it.title) return "";
      const lis=bl.map(b=>{
        const t=finalText(b.id); const ch=mode==="review"&&isChanged(b.id);
        const isSkills = s.heading.toLowerCase().includes("skill");
        const content = isSkills ? (()=>{ const k=t.indexOf(":"); return k>0?`<b>${esc(t.slice(0,k+1))}</b>${markPh(esc(t.slice(k+1)))}`:markPh(esc(t)); })() : markPh(esc(t));
        return `<li${ch?` class="chg ${state.selBullet===b.id?"sel":""}" data-bullet="${b.id}" tabindex="0" title="Changed: select to see why"`:""}>${content}</li>`;
      }).join("");
      const isSkills = s.heading.toLowerCase().includes("skill") || !it.title;
      return `${it.title?`<div class="it"><b>${esc(it.title)}</b><span class="dt">${esc(it.meta)}</span></div>`:""}
        ${lis?`<ul${isSkills&&!it.title?' style="padding-left:16px"':""}>${lis}</ul>`:""}`;
    }).join("");
    return items.trim()?`<div class="sec">${esc(s.heading.toUpperCase())}</div>${items}`:"";
  }).join("");
  return `<div class="paper-wrap"><div class="paper" id="paper"><div id="paperIn"><div class="nm">${esc(R.name)}</div><div class="ct">${esc(R.contact)}</div>${secs}</div></div></div>`;
}
const PAGE_H = 720*11/8.5;
function measureFit(){
  const p=$("#paper"), inn=$("#paperIn"); if(!p||!inn) return;
  const cs=getComputedStyle(p); const padT=parseFloat(cs.paddingTop), padB=parseFloat(cs.paddingBottom);
  const avail = PAGE_H - padT - padB; const used = inn.scrollHeight;
  const over = used > avail;
  p.querySelectorAll(".pagebreak").forEach(e=>e.remove());
  if(over){ const d=document.createElement("div"); d.className="pagebreak"; d.style.top=(PAGE_H - padB)+"px"; d.innerHTML="<span>Page 1 ends here</span>"; p.appendChild(d); }
  const m=$("#fitMeter"), msg=$("#fitMsg"); if(!m||!msg) return;
  const lineH = parseFloat(getComputedStyle(inn).lineHeight)||17;
  const pct = Math.min(100, used/avail*100);
  m.classList.toggle("over",over); m.querySelector("i").style.width=pct+"%";
  const lines=Math.ceil(Math.abs(avail-used)/lineH);
  msg.className="fit-msg"+(over?" over":"");
  msg.textContent = over ? `Over one page by about ${lines} line${lines>1?"s":""}` : `Fits on one page, about ${lines} line${lines>1?"s":""} to spare`;
}

/* ---------- step 4 ---------- */
function v4(){
  const pending=state.sugs.filter(s=>state.dec[s.id].status==="pending").length;
  const changed=state.sugs.filter(s=>["accepted","edited"].includes(state.dec[s.id].status));
  const sel = state.selBullet ? sugForBullet(state.selBullet) : null;
  const selReq = sel ? reqById(sel.reqId) : null;
  const placeholdersLeft = changed.filter(s=>hasPh(state.dec[s.id].text)).length;
  return `
  <h1>You decide</h1>
  <p class="lede">Your tailored version as one page. Highlighted lines are changes you accepted; select one to see why it changed.</p>
  <div class="review">
    <div>${paperHTML("review")}</div>
    <div class="side">
      <section class="panel" aria-labelledby="fitH"><h2 id="fitH">One-page fit</h2>
        <div class="fit" style="margin-top:10px"><div class="fit-meter" id="fitMeter"><i></i></div></div>
        <div class="fit-msg" id="fitMsg" aria-live="polite"></div>
        <p class="small muted" style="margin:6px 0 0">Measured on a US Letter page at the size shown.</p>
      </section>
      ${sel?`<section class="panel detail"><h2>Why this changed</h2>
        <p class="small muted" style="margin:6px 0 2px">Was</p><div class="orig">${esc(sel.original)}</div>
        <p class="small muted" style="margin:10px 0 2px">Posting line ${(selReq.line??-1)+1}</p><q>${esc(state.posting[selReq.line]||selReq.text)}</q>
        <div class="actions" style="margin-top:12px"><button class="btn sm" data-jump="${sel.id}">Change in suggestions</button></div></section>`:""}
      ${state.trims.length?`<section class="panel"><h2>Lines that earn the least space</h2>
        <p class="small muted" style="margin:4px 0 8px">Hide them from this version only. Your master resume keeps them.</p>
        ${state.trims.map(t=>{ const b=bulletById(t.bulletId); if(!b) return ""; return `<label class="trim"><input type="checkbox" data-trim="${t.bulletId}" ${state.hidden.has(t.bulletId)?"checked":""}><span>${esc(b.text)}<span class="why2">${esc(t.reason)}</span></span></label>`; }).join("")}
      </section>`:""}
      <section class="panel"><h2>Before you export</h2>
        <p class="small" style="margin:6px 0 0">${pending?`${pending} suggestion${pending>1?"s are":" is"} still undecided. <button class="linkbtn" data-go="3">Go to suggestions</button>`:"Every suggestion has a decision."}</p>
        ${placeholdersLeft?`<p class="small" style="color:var(--amber);margin:6px 0 0">${placeholdersLeft} accepted line${placeholdersLeft>1?"s still contain":" still contains"} a placeholder.</p>`:""}
        <button class="btn primary" style="width:100%;margin-top:12px" data-go="5">Create this version</button>
      </section>
    </div>
  </div>`;
}

/* ---------- step 5 ---------- */
function finalPlainText(){
  const R=state.resume; const out=[R.name,R.contact,""];
  for(const s of R.sections){ const body=[];
    for(const it of s.items){ const bl=it.bullets.filter(b=>!state.hidden.has(b.id)); if(!bl.length&&!it.title) continue;
      if(it.title) body.push(it.title+(it.meta?"    "+it.meta:"")); bl.forEach(b=>body.push("• "+finalText(b.id))); }
    if(body.length){ out.push(s.heading.toUpperCase(), ...body, ""); } }
  return out.join("\n").trim();
}
function companyName(){ const l=state.posting[0]||"job"; return (l.split(/[:\u2013\u2014-]/)[0]||"job").trim().replace(/[^\w]+/g,"-").replace(/^-|-$/g,"").toLowerCase()||"job"; }
function v5(){
  const changed=state.sugs.filter(s=>["accepted","edited"].includes(state.dec[s.id].status));
  const confirmed=changed.filter(s=>s.needsConfirm);
  return `
  <h1>Your version for this job</h1>
  <p class="lede">Built from your master resume with ${changed.length} change${changed.length===1?"":"s"} you chose${state.hidden.size?` and ${state.hidden.size} line${state.hidden.size>1?"s":""} hidden`:""}.</p>
  <div class="out-grid">
    <div>${paperHTML("clean")}</div>
    <div class="side">
      <section class="panel"><h2>Take it with you</h2>
        <div class="fit" style="margin-top:10px"><div class="fit-meter" id="fitMeter"><i></i></div></div>
        <div class="fit-msg" id="fitMsg"></div>
        <div class="actions" style="margin-top:14px">
          <button class="btn primary" data-act="copy">Copy as text</button>
          ${downloadsApi?`<button class="btn" data-act="download">Download .txt</button>`:""}
        </div>
      </section>
      <section class="panel"><h2>What changed and why</h2>
        ${changed.length?`<ul class="log">${changed.map(s=>{const r=reqById(s.reqId)||{}; return `<li><span class="from">${esc(s.original)}</span><br><span class="to">${markPh(esc(state.dec[s.id].text))}</span><span class="because">For posting line ${(r.line??-1)+1}: ${esc(r.text)}</span></li>`;}).join("")}</ul>`:`<p class="small muted">No changes accepted. This version matches your master resume.</p>`}
      </section>
      ${confirmed.length?`<section class="panel"><h2>Be ready to explain</h2>
        <p class="small muted" style="margin:4px 0 0">You confirmed these are true. Interviewers may ask about them.</p>
        <ul class="defend">${confirmed.map(s=>`<li>${esc(s.claimCheck)}</li>`).join("")}</ul></section>`:""}
      <button class="btn" data-act="another">Tailor for another job</button>
    </div>
  </div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-go],[data-act],[data-req],[data-sug],[data-accept],[data-skip],[data-edit],[data-save],[data-cancel],[data-undo],[data-bullet],[data-jump]");
  if(!t) return;
  const D=t.dataset;
  if(D.go){ const n=+D.go; if(n<=state.maxStep||n===state.step+1){ state.editing=null; go(n);} return; }
  if(D.act==="analyze"){ readInputs(); analyze(); return; }
  if(D.act==="stop"){ state.ctl&&state.ctl.abort(); return; }
  if(D.act==="reset"){ state.resumeText=DEMO_RESUME; state.postingText=DEMO_POSTING; state.err=""; render(); return; }
  if(D.act==="another"){ state.postingText=""; state.maxStep=1; state.err=""; if(state.source==="example") state.resumeText=DEMO_RESUME; go(1); setTimeout(()=>$("#postingIn")&&$("#postingIn").focus(),50); return; }
  if(D.act==="copy"){ try{ await navigator.clipboard.writeText(finalPlainText()); toast("Copied as text"); }catch(_){ toast("Couldn’t copy. Select the text on the page instead."); } return; }
  if(D.act==="download"){ try{ const r=await downloadsApi.save({filename:`resume-${companyName()}.txt`, data:finalPlainText()}); if(r&&r.status==="saved") toast("Downloaded"); }catch(err){ if(err&&err.code!=="cancelled"&&err.code!=="declined") toast("Download didn’t start."); } return; }
  if(D.req && !t.matches("[data-sug]")){ state.activeReq = state.activeReq===D.req?null:D.req; if(state.step===3){ const s=state.sugs.find(x=>x.reqId===D.req); if(s){state.activeSug=s.id; render(); const c=$("#card-"+s.id); c&&c.scrollIntoView({block:"center",behavior:"smooth"}); return;} } render(); return; }
  if(D.sug){ state.activeSug=D.sug; render(); return; }
  if(D.accept){ const d=state.dec[D.accept]; d.status = d.text===state.sugs.find(s=>s.id===D.accept).proposed?"accepted":"edited"; d.auto=false; state.activeSug=D.accept; render(); toast("Accepted"); return; }
  if(D.skip){ state.dec[D.skip].status="skipped"; state.dec[D.skip].auto=false; state.activeSug=D.skip; render(); return; }
  if(D.undo){ const s=state.sugs.find(x=>x.id===D.undo); state.dec[D.undo]={status:"pending",text:s.proposed,confirmed:state.dec[D.undo].confirmed}; render(); return; }
  if(D.edit){ state.editing=D.edit; state.activeSug=D.edit; render(); const ta=$("#edit-"+D.edit); if(ta){ta.focus(); const m=ta.value.search(PH_RE); if(m>=0){const mm=ta.value.match(PH_RE)[0]; ta.setSelectionRange(m,m+mm.length);} } return; }
  if(D.cancel){ state.editing=null; render(); return; }
  if(D.save){ const ta=$("#edit-"+D.save); const v=(ta.value||"").trim(); const s=state.sugs.find(x=>x.id===D.save); const d=state.dec[D.save];
    state.editing=null;
    if(!v){ toast("Write a line or choose Skip."); render(); return; }
    d.text=v;
    const blocked = hasPh(v) || (s.needsConfirm && !d.confirmed);
    if(!blocked){ d.status = v===s.proposed?"accepted":"edited"; d.auto=false; toast("Saved and accepted"); }
    else { d.status="pending"; toast(hasPh(v)?"Saved. Fill in the placeholder to accept.":"Saved. Confirm it’s true to accept."); }
    render(); return; }
  if(D.bullet){ state.selBullet = state.selBullet===D.bullet?null:D.bullet; render(); return; }
  if(D.jump){ state.activeSug=D.jump; go(3); setTimeout(()=>{const c=$("#card-"+D.jump); c&&c.scrollIntoView({block:"center"});},30); return; }
});
document.addEventListener("keydown", e=>{
  if((e.key==="Enter"||e.key===" ") && e.target.matches(".pline[data-req], li[data-bullet]")){ e.preventDefault(); e.target.click(); }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.name==="mode"){ state.mode=t.value; renderSteps(); return; }
  if(t.dataset.confirm){ state.dec[t.dataset.confirm].confirmed=t.checked; render(); return; }
  if(t.dataset.trim){ t.checked?state.hidden.add(t.dataset.trim):state.hidden.delete(t.dataset.trim); render(); return; }
});
document.addEventListener("input", e=>{
  if(e.target.id==="resumeIn") state.resumeText=e.target.value;
  if(e.target.id==="postingIn") state.postingText=e.target.value;
});
function readInputs(){ const a=$("#resumeIn"), b=$("#postingIn"); if(a) state.resumeText=a.value; if(b) state.postingText=b.value; }
window.addEventListener("resize", ()=>{ if(state.step>=4) measureFit(); });
document.fonts && document.fonts.ready.then(()=>{ if(state.step>=4) measureFit(); });

render();
</script>
</body>
</html>
